<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>目擊者之夜 - 派對助手</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --primary: #e53935;
            --primary-dark: #b71c1c;
            --accent: #ffb74d;
            --text-main: #f1f1f1;
            --text-sub: #aaa;
            --border: #333;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px 20px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid #2a2a32;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            font-size: 26px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        h2 {
            color: var(--accent);
            font-size: 20px;
            margin-bottom: 12px;
        }

        p {
            color: var(--text-sub);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(229, 57, 53, 0.3);
        }

        .btn:active {
            background: var(--primary-dark);
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #33333d;
            box-shadow: none;
            border: 1px solid #444452;
        }

        .btn-warning {
            background: #f57f17;
            box-shadow: 0 4px 12px rgba(245, 127, 23, 0.3);
        }

        select {
            width: 100%;
            padding: 14px;
            margin: 12px 0 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #2a2a34;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .card-options {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }

        .card-item {
            flex: 1;
            background: #282832;
            border: 2px solid #444;
            border-radius: 12px;
            padding: 16px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            position: relative;
        }

        .card-item.selected {
            border-color: var(--accent);
            background: #322d20;
            box-shadow: 0 0 12px rgba(255, 183, 77, 0.2);
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .badge-bad { background: #b71c1c; color: #fff; }
        .badge-good { background: #1b5e20; color: #fff; }
        .badge-neutral { background: #f57f17; color: #fff; }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 12px;
            color: #bbb;
            line-height: 1.4;
        }

        .timer-display {
            font-size: 42px;
            font-weight: bold;
            color: var(--accent);
            margin: 16px 0;
            letter-spacing: 2px;
        }

        .vote-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #282832;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: left;
        }

        .vote-row select {
            width: 60%;
            margin: 0;
            padding: 8px;
        }

        .result-title {
            font-size: 20px;
            font-weight: bold;
            margin: 16px 0 8px;
            color: var(--accent);
        }

        .result-box {
            background: #282832;
            border-radius: 10px;
            padding: 16px;
            margin: 16px 0;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
            border-left: 4px solid var(--accent);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <!-- 階段 0: 遊戲設定 -->
    <div id="step-setup">
        <h1>目擊者之夜</h1>
        <p>山中別館發生了命案，兇手就在我們之中！<br>請選擇角色組合等級與遊玩人數：</p>
        <select id="level-select" onchange="updateSetup()"></select>
        <select id="player-count" onchange="updateSetup(true)" style="margin-top:0"></select>
        <div class="result-box" id="setup-info" style="margin:0 0 8px;font-size:13px"></div>
        <button class="btn" onclick="startGame()">開始遊戲</button>
    </div>

    <!-- 階段 1: 防偷看傳閱提示 -->
    <div id="step-pass" class="hidden">
        <h2 id="pass-title">玩家 1 請接過手機</h2>
        <p id="pass-sub">請確認周圍沒有其他人觀看你的螢幕。</p>
        <button class="btn" onclick="revealCards()">點擊查看我的卡牌</button>
    </div>

    <!-- 階段 2: 抽 2 選 1 介面 -->
    <div id="step-choose" class="hidden">
        <h2 id="choose-player-name">玩家 1 的回合</h2>
        <p id="choose-tip">請選擇 <b>1 張卡牌留給自己</b>，剩餘 1 張將傳給下一位玩家：</p>
        
        <div class="card-options">
            <div id="card-0" class="card-item" onclick="selectCard(0)">
                <span id="badge-0" class="badge">陣營</span>
                <div id="title-0" class="card-title">角色 A</div>
                <div id="desc-0" class="card-desc">描述</div>
            </div>
            <div id="card-1" class="card-item" onclick="selectCard(1)">
                <span id="badge-1" class="badge">陣營</span>
                <div id="title-1" class="card-title">角色 B</div>
                <div id="desc-1" class="card-desc">描述</div>
            </div>
        </div>

        <button id="confirm-btn" class="btn btn-secondary" onclick="confirmChoice()" disabled>請先選擇一張卡牌</button>
    </div>

    <!-- 階段 3: 自由討論與計時 -->
    <div id="step-discuss" class="hidden">
        <h2>自由討論階段</h2>
        <p>大家有 3 分鐘時間進行情報交換、推理與說謊！</p>
        <div class="timer-display" id="timer-text">03:00</div>
        
        <button class="btn btn-secondary" onclick="toggleTimer()" id="timer-btn">開始計時</button>
        <button class="btn btn-warning" id="btn-detective" onclick="showDetectiveModal()">偵探公開指定處決</button>
        <button class="btn btn-warning" id="btn-butler" onclick="showButlerModal()">管家查看蓋牌</button>
        <button class="btn" onclick="goToVoting()">直接進入投票階段</button>
    </div>

    <!-- 偵探發動能力彈窗 -->
    <div id="detective-modal" class="hidden">
        <h2>偵探發動公開處決</h2>
        <p>請偵探公開身份，並直接指定一名玩家或<b>客房</b>送進鍋爐室：</p>
        <select id="detective-target"></select>
        <button class="btn" onclick="executeDetectiveSkill()">確認送進鍋爐室</button>
        <button class="btn btn-secondary" onclick="hideDetectiveModal()">取消</button>
    </div>

    <!-- 管家查看蓋牌彈窗 -->
    <div id="butler-modal" class="hidden">
        <h2>管家查看蓋牌</h2>
        <div id="butler-body"></div>
    </div>

    <!-- 階段 4: 投票階段 -->
    <div id="step-vote" class="hidden">
        <h2 id="vote-title">全員投票</h2>
        <p id="vote-desc">請選擇每位玩家要把誰（或<b>客房</b>）投進鍋爐室：</p>
        <div id="vote-list"></div>
        <button class="btn" onclick="tallyVotes()">確認開票與結算</button>
    </div>

    <!-- 階段 5: 結算揭曉 -->
    <div id="step-result" class="hidden">
        <h2 class="result-title" id="winner-title">遊戲結束</h2>
        <div class="result-box" id="result-detail"></div>
        <div class="result-box" id="all-cards-detail" style="border-left-color: #0277bd;"></div>
        <button class="btn" onclick="location.reload()">再開一局</button>
    </div>
</div>

<script>
const ROLE_DATA = {
    '殺人魔': { team: '壞人', badge: 'badge-bad', desc: '【壞人陣營】隱藏身份！目標是最終沒有被關進鍋爐室。' },
    '共犯': { team: '壞人', badge: 'badge-bad', desc: '【壞人陣營】幫殺人魔打掩護、轉移注意力，保住殺人魔即獲勝。' },
    '偵探': { team: '好人', badge: 'badge-good', desc: '【好人陣營】帶領大家找出殺人魔！討論時可公開身份並直接處決一人或客房。' },
    '富商': { team: '好人', badge: 'badge-good', desc: '【好人陣營】開票時可公開身份，你投出的那一票算作 2 票。' },
    '律師': { team: '好人', badge: 'badge-good', desc: '【好人陣營】開票時可公開身份，你投給的那個人獲得的所有票數無效。' },
    '炸彈客': { team: '第三方', badge: 'badge-neutral', desc: '【第三方】你的目標是讓自己被關進鍋爐室！若成功則獨自獲勝。' },
    '管家': { team: '好人', badge: 'badge-good', desc: '【好人陣營】討論時可查看遊戲開始時蓋在鍋爐室旁的 2 張牌，但會失去投票牌。' },
    '客人': { team: '好人', badge: 'badge-good', desc: '【好人陣營】無特殊能力，透過觀察與傳牌邏輯找出殺人魔。' }
};

let deck = [];
let players = [];
let currentIndex = 0;
let cardInHand = null; 
let currentChoices = []; 
let selectedIndex = -1;
let timerInterval = null;
let timeLeft = 180;

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

const ALL7 = ['殺人魔', '共犯', '炸彈客', '律師', '富商', '偵探', '管家'];
const LEVELS = {
    1: { roles: ['殺人魔'], guests: { 3: 3, 4: 4 } },
    2: { roles: ['殺人魔', '共犯'], guests: { 3: 2, 4: 3, 5: 4 } },
    3: { roles: ['殺人魔', '共犯', '律師'], guests: { 4: 2, 5: 3, 6: 4 } },
    4: { roles: ['殺人魔', '炸彈客'], guests: { 3: 2, 4: 3, 5: 4 } },
    5: { roles: ['殺人魔', '炸彈客', '富商'], guests: { 4: 2, 5: 3, 6: 4 } },
    6: { roles: ['殺人魔', '炸彈客', '偵探'], guests: { 4: 2, 5: 3, 6: 4 } },
    7: { roles: ALL7, guests: { 4: 0, 5: 1, 6: 2 }, aside: 2, removed: 0 },
    8: { roles: ALL7, guests: { 4: 2, 5: 3, 6: 4 }, aside: 2, removed: 2 }
};

let asideCards = [];   // 管家規則：蓋在鍋爐室旁的 2 張牌
let removedCount = 0;
let butlerUser = null; // 已使用能力（失去投票權）的管家玩家 id
let levelCfg = null;

function buildRoles(level, count) {
    const cfg = LEVELS[level];
    const roles = [...cfg.roles];
    for (let i = 0; i < cfg.guests[count]; i++) roles.push('客人');
    return roles;
}

function updateSetup(keepCount) {
    const levelSel = document.getElementById('level-select');
    const countSel = document.getElementById('player-count');
    if (!levelSel.options.length) {
        levelSel.innerHTML = Object.keys(LEVELS).map(l => {
            const r = LEVELS[l].roles.filter(x => x !== '殺人魔');
            const label = LEVELS[l].aside ? '全角色（含管家）' : r.concat('客人').join('、');
            const ps = Object.keys(LEVELS[l].guests);
            return `<option value="${l}">等級 ${l}｜${ps[0]}～${ps[ps.length - 1]} 人｜${label}</option>`;
        }).join('');
    }
    const level = parseInt(levelSel.value);
    const cfg = LEVELS[level];
    const counts = Object.keys(cfg.guests);
    if (!keepCount) {
        const prev = countSel.value;
        countSel.innerHTML = counts.map(c => `<option value="${c}">${c} 人</option>`).join('');
        if (counts.includes(prev)) countSel.value = prev;
    }
    const count = parseInt(countSel.value);
    const roles = buildRoles(level, count);
    const tally = {};
    roles.forEach(r => tally[r] = (tally[r] || 0) + 1);
    let info = '<b>牌組：</b>' + Object.entries(tally).map(([r, n]) => n > 1 ? `${r}×${n}` : r).join('、');
    if (cfg.aside) {
        info += `<br><b>管家規則：</b>先排除殺人魔，隨機抽 2 張蓋在鍋爐室旁` +
            (cfg.removed ? `，再移除 ${cfg.removed} 張出遊戲` : '') + '，最後殺人魔放回牌庫。';
    }
    document.getElementById('setup-info').innerHTML = info;
}

function startGame() {
    const level = parseInt(document.getElementById('level-select').value);
    const count = parseInt(document.getElementById('player-count').value);
    levelCfg = LEVELS[level];

    let roles = buildRoles(level, count);
    asideCards = [];
    butlerUser = null;

    if (levelCfg.aside) {
        // 管家規則：排除殺人魔 → 抽 2 張蓋牌 → (等級8) 再移除 2 張 → 殺人魔放回
        const rest = shuffle(roles.filter(r => r !== '殺人魔'));
        asideCards = rest.splice(0, levelCfg.aside);
        rest.splice(0, levelCfg.removed);
        roles = rest.concat('殺人魔');
    }

    deck = shuffle(roles);
    players = Array.from({ length: count }, (_, i) => ({
        id: i + 1,
        name: `玩家 ${i + 1}`,
        card: null
    }));

    currentIndex = 0;
    cardInHand = null;

    prepareTurn();
}

function prepareTurn() {
    document.getElementById('step-setup').classList.add('hidden');
    document.getElementById('step-choose').classList.add('hidden');
    document.getElementById('step-pass').classList.remove('hidden');

    const pName = players[currentIndex].name;
    document.getElementById('pass-title').innerText = `${pName} 請接過手機`;
    if (currentIndex === 0) {
        document.getElementById('pass-sub').innerText = '你是起始玩家，將從牌庫抽取 2 張卡牌。';
    } else {
        document.getElementById('pass-sub').innerText = `已收到上一位玩家傳來的 1 張卡牌，並從牌庫自動抽取 1 張。`;
    }
}

function revealCards() {
    document.getElementById('step-pass').classList.add('hidden');
    document.getElementById('step-choose').classList.remove('hidden');

    document.getElementById('choose-player-name').innerText = `${players[currentIndex].name} 的回合`;

    if (currentIndex === 0) {
        currentChoices = [deck.pop(), deck.pop()];
    } else {
        currentChoices = [cardInHand, deck.pop()];
    }

    selectedIndex = -1;
    document.getElementById('confirm-btn').disabled = true;
    document.getElementById('confirm-btn').classList.add('btn-secondary');
    document.getElementById('confirm-btn').innerText = '請先選擇一張卡牌';

    for (let i = 0; i < 2; i++) {
        const cardName = currentChoices[i];
        const info = ROLE_DATA[cardName];
        const el = document.getElementById(`card-${i}`);
        
        el.classList.remove('selected');
        document.getElementById(`title-${i}`).innerText = cardName;
        document.getElementById(`desc-${i}`).innerText = info.desc;
        
        const badgeEl = document.getElementById(`badge-${i}`);
        badgeEl.className = `badge ${info.badge}`;
        
        if (currentIndex > 0 && i === 0) {
            badgeEl.innerText = `[傳來的] ${info.team}`;
        } else {
            badgeEl.innerText = info.team;
        }
    }
}

function selectCard(idx) {
    selectedIndex = idx;
    document.getElementById('card-0').classList.toggle('selected', idx === 0);
    document.getElementById('card-1').classList.toggle('selected', idx === 1);

    const btn = document.getElementById('confirm-btn');
    btn.disabled = false;
    btn.classList.remove('btn-secondary');
    btn.innerText = `確認保留【${currentChoices[idx]}】，傳遞另一張`;
}

function confirmChoice() {
    if (selectedIndex === -1) return;

    players[currentIndex].card = currentChoices[selectedIndex];
    cardInHand = currentChoices[1 - selectedIndex];

    currentIndex++;

    if (currentIndex < players.length) {
        prepareTurn();
    } else {
        deck.push(cardInHand);
        startDiscussion();
    }
}

function startDiscussion() {
    document.getElementById('step-choose').classList.add('hidden');
    document.getElementById('step-discuss').classList.remove('hidden');
    document.getElementById('btn-detective').classList.toggle('hidden', !levelCfg.roles.includes('偵探'));
    document.getElementById('btn-butler').classList.toggle('hidden', !levelCfg.roles.includes('管家'));
    updateTimerDisplay();
}

function toggleTimer() {
    const btn = document.getElementById('timer-btn');
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        btn.innerText = '繼續計時';
    } else {
        timerInterval = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                updateTimerDisplay();
            } else {
                clearInterval(timerInterval);
                timerInterval = null;
                alert('時間到！請開始投票或進行討論處決！');
            }
        }, 1000);
        btn.innerText = '暫停計時';
    }
}

function updateTimerDisplay() {
    const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
    const secs = String(timeLeft % 60).padStart(2, '0');
    document.getElementById('timer-text').innerText = `${mins}:${secs}`;
}

function showDetectiveModal() {
    const select = document.getElementById('detective-target');
    let optionsHtml = players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    optionsHtml += `<option value="ROOM">🏠 客房（預留卡牌）</option>`;
    select.innerHTML = optionsHtml;
    document.getElementById('detective-modal').classList.remove('hidden');
}

function hideDetectiveModal() {
    document.getElementById('detective-modal').classList.add('hidden');
}

function executeDetectiveSkill() {
    const targetVal = document.getElementById('detective-target').value;
    hideDetectiveModal();

    if (targetVal === 'ROOM') {
        finalizeGame('ROOM', '🏠 客房（預留卡牌）', '偵探發動公開處決！直接將【客房】預留卡牌送進鍋爐室。');
    } else {
        const targetPlayer = players.find(p => p.id === parseInt(targetVal));
        finalizeGame(targetPlayer.id, targetPlayer.name, '偵探發動公開處決！直接將其關進鍋爐室。');
    }
}

let pkCandidates = null; // 平票 PK 時的候選人（null 代表一般投票）

function showButlerModal() {
    if (butlerUser !== null) { alert('管家已經使用過能力了。'); return; }
    const opts = players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    document.getElementById('butler-body').innerHTML = `
        <p>請管家本人選擇自己的玩家編號。<b>查看蓋牌後將失去投票牌。</b></p>
        <select id="butler-player">${opts}</select>
        <button class="btn" onclick="butlerConfirm()">確認查看蓋牌</button>
        <button class="btn btn-secondary" onclick="hideButlerModal()">取消</button>`;
    document.getElementById('butler-modal').classList.remove('hidden');
}

function hideButlerModal() {
    document.getElementById('butler-modal').classList.add('hidden');
}

function butlerConfirm() {
    const p = players.find(x => x.id === parseInt(document.getElementById('butler-player').value));
    if (p.card !== '管家') { alert('此玩家不是管家，無法使用管家能力。'); return; }
    if (!confirm('請其他人不要看螢幕。查看後管家將失去投票牌，確定嗎？')) return;
    butlerUser = p.id;
    document.getElementById('butler-body').innerHTML = `
        <p>${p.name}（管家）看到的蓋牌：</p>
        <div class="result-box"><b>${asideCards.join('、')}</b></div>
        <p>你已失去投票牌。看完請按下方按鈕，再把手機放回桌上。</p>
        <button class="btn" onclick="hideButlerModal()">我看完了</button>`;
}

function goToVoting(candidates) {
    if (timerInterval) clearInterval(timerInterval);
    pkCandidates = Array.isArray(candidates) ? candidates.map(String) : null;
    const isPK = pkCandidates !== null;

    document.getElementById('step-discuss').classList.add('hidden');
    document.getElementById('step-result').classList.add('hidden');
    document.getElementById('step-vote').classList.remove('hidden');

    const nameOf = k => k === 'ROOM' ? '🏠 客房' : players.find(p => String(p.id) === k).name;
    document.getElementById('vote-title').innerText = isPK ? '⚔️ 平票 PK 投票' : '全員投票';
    document.getElementById('vote-desc').innerHTML = isPK
        ? `最高票平手！只能在 <b>${pkCandidates.map(nameOf).join('、')}</b> 之間投票。<br>若 PK 仍平票，則平票者<b>全部</b>進鍋爐室（雙殺）。`
        : '請選擇每位玩家要把誰（或<b>客房</b>）投進鍋爐室：';

    const container = document.getElementById('vote-list');
    container.innerHTML = players.map(p => {
        let keys = players.filter(t => t.id !== p.id).map(t => String(t.id));
        keys.push('ROOM');
        if (isPK) keys = keys.filter(k => pkCandidates.includes(k));
        const options = keys.map(k => `<option value="${k}">${nameOf(k)}</option>`).join('');
        if (p.id === butlerUser) {
            return `<div class="vote-row"><span><b>${p.name}</b>（管家）已失去投票牌</span></div>`;
        }
        return `
            <div class="vote-row">
                <span><b>${p.name}</b> 投給：</span>
                <select id="vote-from-${p.id}">${options}</select>
            </div>
        `;
    }).join('');
}

function tallyVotes() {
    let voteCounts = { 'ROOM': 0 };
    players.forEach(p => voteCounts[p.id] = 0);

    // 檢查是否有律師發動能力
    let lawyer = players.find(p => p.card === '律師');
    let nullifiedTargetVal = null;
    if (lawyer) {
        nullifiedTargetVal = document.getElementById(`vote-from-${lawyer.id}`).value;
    }

    // 計算票數（富商票數權重為 2）
    players.forEach(p => {
        const voteEl = document.getElementById(`vote-from-${p.id}`);
        if (!voteEl) return; // 管家已失去投票牌
        let targetVal = voteEl.value;
        let weight = (p.card === '富商') ? 2 : 1;
        voteCounts[targetVal] += weight;
    });

    let extraNote = '';
    if (lawyer && nullifiedTargetVal) {
        let targetName = nullifiedTargetVal === 'ROOM' ? '🏠 客房' : players.find(p => p.id === parseInt(nullifiedTargetVal)).name;
        extraNote = `<br>⚖️ 律師公開發動能力：投給了 <b>${targetName}</b>，使其獲得的票數全部清零！`;
        voteCounts[nullifiedTargetVal] = 0;
    }

    // 計算最高票數
    let maxVotes = -1;
    let highestKeys = [];

    const countKeys = pkCandidates || Object.keys(voteCounts);
    for (const key of countKeys) {
        if (voteCounts[key] > maxVotes) {
            maxVotes = voteCounts[key];
            highestKeys = [key];
        } else if (voteCounts[key] === maxVotes) {
            highestKeys.push(key);
        }
    }

    // 平票處理：第一次平票 → PK；PK 仍平票 → 雙殺（平票者全部進鍋爐室）
    if (highestKeys.length > 1) {
        if (pkCandidates === null) {
            const tiedNames = highestKeys.map(k => k === 'ROOM' ? '客房' : players.find(p => String(p.id) === k).name).join('、');
            alert(`平票！${tiedNames} 同為 ${maxVotes} 票，進入 PK 投票。`);
            goToVoting(highestKeys);
            return;
        }
        const targets = highestKeys.map(k => ({
            id: k,
            name: k === 'ROOM' ? '🏠 客房（預留卡牌）' : players.find(p => String(p.id) === k).name
        }));
        finalizeMulti(targets, `PK 後仍平票（各 ${maxVotes} 票），觸發<b>雙殺</b>：平票者全部被關進鍋爐室。${extraNote}`);
        return;
    }

    let sentencedKey = highestKeys[0];
    if (sentencedKey === 'ROOM') {
        finalizeGame('ROOM', '🏠 客房（預留卡牌）', `客房獲得最高票被送進鍋爐室（得票：${maxVotes} 票）。${extraNote}`);
    } else {
        let sentencedPlayer = players.find(p => p.id === parseInt(sentencedKey));
        finalizeGame(sentencedPlayer.id, sentencedPlayer.name, `最高票被關進鍋爐室（得票：${maxVotes} 票）。${extraNote}`);
    }
}

function finalizeGame(targetId, targetName, reason) {
    finalizeMulti([{ id: targetId, name: targetName }], reason);
}

function finalizeMulti(targets, reason) {
    document.getElementById('step-discuss').classList.add('hidden');
    document.getElementById('step-vote').classList.add('hidden');
    document.getElementById('step-result').classList.remove('hidden');

    const executed = targets.map(t => ({
        name: t.name,
        card: String(t.id) === 'ROOM' ? deck[0] : players.find(p => String(p.id) === String(t.id)).card
    }));
    const names = executed.map(e => e.name).join('、');
    const list = executed.map(e => `【${e.card}】（${e.name}）`).join('、');
    const has = r => executed.some(e => e.card === r);

    let titleText = '';
    let resultHtml = `<b>裁決對象：</b>${names}<br><b>說明：</b>${reason}<br><br>`;

    if (has('炸彈客')) {
        titleText = '💥 炸彈客引爆獨贏！';
        resultHtml += `🔥 被關進鍋爐室的有：${list}<br>炸彈客成功讓自己被關進鍋爐室，獨自獲得最終勝利！其他所有人皆失敗。`;
    } else if (has('殺人魔')) {
        titleText = '🎉 賓客陣營（好人）獲勝！';
        resultHtml += `⚖️ 被關進鍋爐室的有：${list}<br>正義得以伸張，【殺人魔】被送進鍋爐室！`;
    } else {
        titleText = '😈 壞人陣營獲勝！';
        resultHtml += `🩸 被關進鍋爐室的有：${list}<br>抓錯人了！真正的殺人魔成功混淆視聽並順利逃脫！`;
    }

    document.getElementById('winner-title').innerText = titleText;
    document.getElementById('result-detail').innerHTML = resultHtml;

    // 顯示全場真實卡牌分佈
    let cardsHtml = `<b>【全場身份揭曉】</b><br>`;
    players.forEach(p => {
        const info = ROLE_DATA[p.card];
        cardsHtml += `${p.name}：<b>${p.card}</b> (${info.team})<br>`;
    });
    cardsHtml += `<br>🏠 客房預留牌：<b>${deck[0]}</b> (${ROLE_DATA[deck[0]].team})`;
    
    if (asideCards.length) cardsHtml += `<br>🔒 蓋牌（管家可看）：<b>${asideCards.join('、')}</b>`;
    document.getElementById('all-cards-detail').innerHTML = cardsHtml;
}
updateSetup();
</script>
